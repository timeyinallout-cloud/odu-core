[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odu-core"
version = "0.1.0"
description = "The 256 Odù Ifá as a canonical byte mapping, with Yorùbá orthography intact."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["odu", "ifa", "yoruba", "binary", "heritage-computing", "encoding"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Sociology :: History",
  "Natural Language :: Yoruba",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
odu = "odu_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/odu_core"]

# The canonical JSON ships inside the package so an installed copy reads the
# same bytes as a checkout. It is data, not code, and it is the source of truth.
[tool.hatch.build.targets.wheel.force-include]
"data/principal_odu.json" = "odu_core/data/principal_odu.json"
"data/odu_256.json" = "odu_core/data/odu_256.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
